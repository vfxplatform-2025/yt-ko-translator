<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1f2330; --sub: #6b7185; --line: #e6e8f0;
    --accent: #5b4ce6; --accent2: #7c3aed; --accent-soft: #eeebff;
    --ok: #16a34a; --ok-soft: #e7f7ec; --bad: #dc2626; --bad-soft: #fdecec; --warn: #b45309; --warn-soft: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181d; --card: #212329; --text: #e8e9ef; --sub: #9a9fb0; --line: #2f323b;
      --accent: #8b7dff; --accent2: #a78bfa; --accent-soft: #2b2847;
      --ok: #4ade80; --ok-soft: #1c2f23; --bad: #f87171; --bad-soft: #3a1f22; --warn: #fbbf24; --warn-soft: #3a3020;
    }
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px;
           background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  header img { width: 30px; height: 30px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  header .title { font-weight: 700; font-size: 14px; }
  header .host { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px;
                 padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.18); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; }
  .host.ok .dot { background: #4ade80; } .host.bad .dot { background: #f87171; }

  main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
  .card h3 { margin: 8px 0 2px; font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: .02em; }
  .row { display: flex; align-items: center; justify-content: space-between; min-height: 38px; gap: 10px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .sub { font-size: 11px; color: var(--sub); }

  /* 토글 스위치 */
  .sw { position: relative; width: 36px; height: 20px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .15s; cursor: pointer; }
  .sw span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%;
                    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: .15s; }
  .sw input:checked + span { background: var(--accent); }
  .sw input:checked + span::after { transform: translateX(16px); }
  .sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 언어 선택 */
  .langs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 6px; padding: 8px 0 12px; }
  .langs label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--sub); }
  .langs .arrow { padding-bottom: 7px; color: var(--accent); font-size: 16px; }
  select { width: 100%; font: inherit; font-size: 12px; color: var(--text); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
  select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  input[type=range] { width: 130px; accent-color: var(--accent); }
  #fsv, #spv { display: inline-block; width: 34px; text-align: right; color: var(--sub); font-size: 12px; }

  /* 현재 영상 */
  #now { padding: 8px 0 10px; display: flex; flex-direction: column; gap: 7px; }
  .pair { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px;
          background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12px; }
  .chip.muted { background: var(--bg); color: var(--sub); font-weight: 500; }
  .meta { font-size: 11px; color: var(--sub); }
  .note { font-size: 11px; padding: 5px 8px; border-radius: 6px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.ok { background: var(--ok-soft); color: var(--ok); }
  .bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .bar.dim > i { opacity: .6; }
  .meta.debug { font-family: monospace; font-size: 10px; opacity: .75; }
  .empty { color: var(--sub); font-size: 12px; padding: 4px 0; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div class="title">YouTube 자막 번역</div>
    <div id="host" class="host"><span class="dot"></span><span id="hostText">확인 중</span></div>
  </header>

  <main>
    <section class="card">
      <div class="row">
        <div>번역 기능 사용<div class="sub">영상마다 플레이어의 번역 버튼으로 켜고 끕니다 (기본 꺼짐)</div></div>
        <label class="sw"><input type="checkbox" id="enabled"><span></span></label>
      </div>
    </section>

    <section class="card">
      <h3>언어</h3>
      <div class="langs">
        <label>원문<select id="sourceLang"></select></label>
        <div class="arrow">→</div>
        <label>번역<select id="targetLang"></select></label>
      </div>
    </section>

    <section class="card">
      <h3>현재 영상</h3>
      <div id="now"><div class="empty">확인 중…</div></div>
    </section>

    <section class="card">
      <div class="row">
        <div>자막 없으면 음성 인식<div class="sub">오디오를 받아 직접 받아쓰기</div></div>
        <label class="sw"><input type="checkbox" id="sttEnabled"><span></span></label>
      </div>
      <div class="row">
        <div>음성 인식 모델<div class="sub">자막이 없을 때 받아쓰기에 사용</div></div>
        <select id="sttEngine" style="width:150px">
          <option value="whisper">Whisper large-v3 (다국어)</option>
          <option value="haas">Haas-ja (일본어 · 그 외 Whisper)</option>
          <option value="qwen">Qwen3-ASR 1.7B (다국어)</option>
          <option value="nemotron">Nemotron 3.5 ASR 0.6B (다국어)</option>
        </select>
      </div>
      <div class="row">
        <div>자동 생성 자막 대신 음성 인식<div class="sub">유튜브 자동 자막보다 정확 · 처음에 30초~1분 대기</div></div>
        <label class="sw"><input type="checkbox" id="preferStt"><span></span></label>
      </div>
      <div class="row"><span>원문도 함께 표시</span><label class="sw"><input type="checkbox" id="showOriginal"><span></span></label></div>
      <div class="row"><span>글자 크기</span><span><input type="range" id="fontSize" min="16" max="48" step="1"><span id="fsv"></span></span></div>
      <div class="row">
        <div>자막 위치<div class="sub">화면 아래에서 띄우는 거리 (0% = 맨 아래)</div></div>
        <span><input type="range" id="subPos" min="0" max="30" step="1"><span id="spv"></span></span>
      </div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
